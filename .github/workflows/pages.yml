# Deploy lvgl-front to GitHub Pages
name: pages-lvgl-front

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload lvgl-front as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: lvgl-front
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
